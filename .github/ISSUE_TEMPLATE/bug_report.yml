name: 🐛 Bug Report
description: Report a bug to help us improve the project
title: 'fix: [Brief, Descriptive Bug Title]' # Conventional Commit style prefix
labels: ['bug', 'severity:medium', 'needs-triage'] # Common labels for bugs
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        To help us understand and fix the issue quickly, please provide as much detail as possible.

  - type: textarea
    id: bug-description
    attributes:
      label: 🐞 Describe the bug
      description: A clear and concise description of what the bug is. What's happening?
      placeholder: |
        Example: "When clicking the 'Save' button, the form does not submit."
        "The application crashes when trying to load images."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 🪜 Steps to Reproduce
      description: |
        Provide clear and numbered steps to reproduce the behavior.
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error/unexpected behavior
      placeholder: |
        Example:
        1. Log in as a standard user.
        2. Navigate to /settings.
        3. Change the 'Theme' to 'Dark'.
        4. Click 'Save'.
        5. Observe that the theme does not change and an error message appears.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: |
        Example: "The form should submit successfully and redirect to the dashboard."
        "The Dark theme should be applied immediately."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 Screenshots
      description: |
        If applicable, add screenshots or screen recordings to help explain your problem.
        You can drag and drop images directly into this field.
    validations:
      required: false

  - type: dropdown
    id: operating-system
    attributes:
      label: 🖥️ Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other (please specify in 'Additional context')
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: 🌐 Browser
      description: What browser are you using? (e.g., Chrome, Firefox, Safari, Edge)
      placeholder: e.g., Chrome
    validations:
      required: false

  - type: input
    id: browser-version
    attributes:
      label: 📈 Browser Version
      description: The version number of your browser.
      placeholder: e.g., 120.0.6099.217
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: 📦 Application Version
      description: If applicable, what version of the application/service are you using?
      placeholder: e.g., v1.2.3 or commit hash
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: ➕ Additional Context
      description: Add any other context about the problem here (e.g., error messages from console, network requests, specific user roles, etc.).
      placeholder: Console errors, network issues, user roles, etc.
    validations:
      required: false

  - type: checkboxes
    id: self-check
    attributes:
      label: Self-Check
      options:
        - label: I have searched the existing issues and confirmed that this is not a duplicate.
          required: true
        - label: I have provided clear steps to reproduce the bug.
          required: true
        - label: I have described the expected behavior.
          required: true